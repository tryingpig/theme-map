name: Update theme map data

on:
  schedule:
    # 평일 19:12 KST (10:12 UTC) — 종가 확정 후 하루 한 번.
    # 원래 '30 9' 였는데, GitHub 이 정각·30분처럼 붐비는 슬롯의 schedule 을
    # 부하에 따라 크게 지연시키다 끝내 버린다. 실제로 8/27·8/28 은 10~11시간
    # 밀렸고 그 뒤로는 실행 자체가 없었다(같은 cron 을 쓰던 rs-tracker·
    # datalab-monitor 도 초 단위까지 동일하게 누락). 임의의 분으로 옮기고
    # 다른 트래커(09:47/09:58)와도 겹치지 않게 분산한다.
    - cron: '12 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theme-map-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync universe from Notion   # data/universe.json 생성 (실패 시 기존 파일 유지)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_from_notion.py

      - name: Build theme data
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음 (휴장일 등) — 커밋 생략"
          else
            git commit -m "data: update theme map ($(date -u +%Y-%m-%d))"
            git push
          fi
