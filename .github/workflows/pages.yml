name: Deploy to GitHub Pages

# legacy(브랜치 직접 서빙) 방식이 2026-08-26에 'building' 상태로 1시간 넘게 멈춰
# 데이터 갱신이 사이트에 반영되지 않았다. 잡이 하나도 생성되지 않는 startup_failure라
# 로그도 남지 않았다. 그래서 배포를 이 레포 안의 워크플로로 끌고 왔다 — 실패하면 로그가 남는다.

on:
  push:
    branches: [main]
  # GITHUB_TOKEN 으로 민 커밋은 다른 워크플로를 트리거하지 않는다(GitHub 의 루프
  # 방지 규칙). 그래서 update.yml 의 데이터 커밋은 위 push 트리거를 못 깨웠고,
  # 레포 data/index.json 은 최신인데 사이트는 사람이 직접 push 한 시점에 멈춰
  # 있었다(2026-09-01 확인: repo 09/01 00:15 vs 사이트 08/31 10:18).
  # workflow_run 은 누가 밀었든 상관없이 걸리므로 이걸로 데이터 갱신을 잇는다.
  workflow_run:
    workflows: ["Update theme map data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 데이터 갱신 워크플로가 커밋을 밀어 배포가 연달아 걸릴 때, 최신 것만 살린다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
